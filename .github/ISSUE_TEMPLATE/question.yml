# The feedback button in ros.ai fills these fields in through the link (?template=question.yml&message=…&details=…), so keep their ids.
name: Question
description: Ask how something in ros.ai works.
title: "Question: "
labels: ["question"]
body:
  - type: textarea
    id: message
    attributes:
      label: What would you like to know?
      description: This page is public, so leave out anything private.
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: App details
      description: Optional. The feedback button in ros.ai fills this in.

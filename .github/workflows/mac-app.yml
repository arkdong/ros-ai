# Builds the ros.ai app: ros.ai.app for Apple silicon and Intel Macs, each on a Mac of that architecture so the
# native packages (the Claude Code binary inside the Agent SDK, PDF rendering) match, and a Windows installer on
# Windows. Start it by hand (Actions → Desktop app → Run workflow) or push a v* tag. A tag publishes a GitHub
# release once every build is attached: installed Mac apps update from the zips (src/server/updates.ts), so a
# release never shows up half-built, and its tag must match the version in package.json.
# With the five Apple secrets below (desktop/README.md › Signing and notarization) the Mac app and its disk image are
# signed with the Developer ID, notarized by Apple and checked the way Gatekeeper will; without CSC_LINK the app is
# unsigned and macOS asks for "Open Anyway" once. With WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD the Windows installer is signed; without them
# Windows SmartScreen asks once (More info, then Run anyway).
name: Desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      # Let the other Mac finish, so one failure still shows whether the other architecture builds.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: mac
            arch: arm64
          - runner: macos-15-intel
            os: mac
            arch: x64
          - runner: windows-latest
            os: windows
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # An app that calls itself older than its release would offer the same update forever.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json. Set the version first (npm version <x.y.z> --no-git-tag-version), merge it, then tag."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the Mac app
        if: matrix.os == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate: building an unsigned app."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            node desktop/run.mjs --build --${{ matrix.arch }}
            exit 0
          fi
          # A signed app that Apple has not notarized is blocked just like an unsigned one, so signing needs all five.
          missing=""
          for key in CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!key}" ] || missing="$missing $key"; done
          if [ -n "$missing" ]; then echo "::error::CSC_LINK is set but these secrets are missing:$missing (see desktop/README.md › Signing and notarization)."; exit 1; fi
          # electron-builder signs every file in the app with the Developer ID, notarizes and staples the app (it reads
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID), then builds the zip and the disk image, which it signs too.
          node desktop/run.mjs --build --${{ matrix.arch }} -c.mac.notarize=true -c.dmg.sign=true
          echo "MAC_SIGNED=1" >> "$GITHUB_ENV"
      # The disk image is what people download: notarize it as well and staple the ticket into it, so it opens
      # without a check over the network.
      - name: Notarize the disk image
        if: matrix.os == 'mac' && env.MAC_SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in desktop/dist/*.dmg; do
            out=$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait 2>&1) || true
            echo "$out"
            if ! grep -q "status: Accepted" <<<"$out"; then
              id=$(awk '/^ *id:/ {print $2; exit}' <<<"$out")
              [ -n "$id" ] && xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "::error::Apple did not accept $dmg for notarization (the log above says why)."; exit 1
            fi
            xcrun stapler staple "$dmg"
          done
      # Fails the run unless macOS itself would open the app and the disk image without a warning.
      - name: Check the signature the way macOS will
        if: matrix.os == 'mac' && env.MAC_SIGNED == '1'
        run: |
          app=$(find desktop/dist -maxdepth 2 -type d -name 'ros.ai.app' | head -n 1)
          [ -n "$app" ] || { echo "::error::No ros.ai.app in desktop/dist."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Timestamp)'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee spctl.txt
          grep -q 'source=Notarized Developer ID' spctl.txt || { echo "::error::macOS would not accept ros.ai.app as notarized."; exit 1; }
          for dmg in desktop/dist/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done
      - name: Build the Windows installer
        if: matrix.os == 'windows'
        env:
          # Only a Windows certificate: CSC_LINK holds the Apple one.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "No Windows certificate: building an unsigned installer."; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          node desktop/run.mjs --build --${{ matrix.arch }}
      # Install the way a person would (no administrator), open the installed app, and keep a picture of its first
      # window: the run fails when ros.ai does not start on Windows.
      - name: Install and open the Windows app
        if: matrix.os == 'windows'
        timeout-minutes: 10
        run: |
          installer=$(ls desktop/dist/ros.ai-[0-9]*-${{ matrix.arch }}.exe)
          powershell -NoProfile -Command "\$p = Start-Process -Wait -PassThru -FilePath '$(cygpath -w "$installer")' -ArgumentList '/S'; Write-Output ('installer exit code ' + \$p.ExitCode)"
          # electron-builder names the folder after the package (ros-ai); find the installed app wherever it went.
          app=""
          for i in $(seq 1 90); do
            app=$(find "$LOCALAPPDATA/Programs" -maxdepth 2 -iname ros-ai.exe 2>/dev/null | head -n 1)
            [ -n "$app" ] && ls "$(dirname "$app")"/Uninstall*.exe >/dev/null 2>&1 && break
            sleep 2
          done
          [ -n "$app" ] || { echo "::error::The installer put no ros-ai.exe under $LOCALAPPDATA/Programs."; ls "$LOCALAPPDATA/Programs" || true; find "$LOCALAPPDATA" "$PROGRAMFILES" -maxdepth 3 -iname 'ros-ai.exe' 2>/dev/null || true; exit 1; }
          echo "Installed at $app"; ls "$(dirname "$app")"
          mkdir -p smoke
          # A saved key, as after a sign-in or an added API key: the app must still start with one, although Windows
          # reports every file as readable by everyone.
          data="$(cygpath -u "$RUNNER_TEMP")/ros-ai-data"; mkdir -p "$data"; printf '%s' '{"version":1,"keys":{}}' > "$data/tool-credentials.json"
          ROS_DESKTOP_SMOKE="$(cygpath -w "$PWD/smoke/windows-first-window.png")" ROS_DATA_DIR="$(cygpath -w "$RUNNER_TEMP/ros-ai-data")" ROS_UPDATE_URL=off \
            timeout 300 "$app" || true
          log="$APPDATA/ros.ai/desktop/logs/server.log"
          [ -f "$log" ] && { echo "--- server log"; tail -n 40 "$log"; cp "$log" smoke/; }
          [ -s smoke/windows-first-window.png ] || { echo "::error::The installed Windows app did not open its window."; exit 1; }
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows' && always()
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ros.ai-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
          # Tagged builds live on as release assets; these copies only need to
          # last long enough to try a branch build. Keeps Actions storage small.
          retention-days: 3
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ros.ai-*
          merge-multiple: true
          path: dist
      # Fixed names beside the versioned files, so ros-ai.io can link the latest build directly:
      # https://github.com/arkdong/ros-ai/releases/latest/download/ros.ai-mac-arm64.dmg (and ros.ai-windows-x64.exe)
      - name: Add fixed-name copies of the installers
        run: |
          for arch in arm64 x64; do
            cp dist/ros.ai-[0-9]*-"$arch".dmg "dist/ros.ai-mac-$arch.dmg"
          done
          cp dist/ros.ai-[0-9]*-x64.exe dist/ros.ai-windows-x64.exe
      # A draft first, published only once every file is attached.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

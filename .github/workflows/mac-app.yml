# Builds the ros.ai app: ros.ai.app for Apple silicon and Intel Macs, each on a Mac of that architecture so the
# native packages (the Claude Code binary inside the Agent SDK, PDF rendering) match, and a Windows installer on
# Windows. Start it by hand (Actions → Desktop app → Run workflow) or push a v* tag. A tag publishes a GitHub
# release once every build is attached: installed Mac apps update from the zips (src/server/updates.ts), so a
# release never shows up half-built, and its tag must match the version in package.json.
# With the five Apple secrets below the Mac app is signed and notarized; without them it is unsigned and macOS asks
# for "Open Anyway" once. With WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD the Windows installer is signed; without them
# Windows SmartScreen asks once (More info, then Run anyway).
name: Desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      # Let the other Mac finish, so one failure still shows whether the other architecture builds.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: mac
            arch: arm64
          - runner: macos-15-intel
            os: mac
            arch: x64
          - runner: windows-latest
            os: windows
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # An app that calls itself older than its release would offer the same update forever.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json. Set the version first (npm version <x.y.z> --no-git-tag-version), merge it, then tag."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the Mac app
        if: matrix.os == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate: building an unsigned app."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            node desktop/run.mjs --build --${{ matrix.arch }}
          elif [ -n "$APPLE_ID" ]; then
            node desktop/run.mjs --build --${{ matrix.arch }} -c.mac.notarize=true
          else
            node desktop/run.mjs --build --${{ matrix.arch }}
          fi
      - name: Build the Windows installer
        if: matrix.os == 'windows'
        env:
          # Only a Windows certificate: CSC_LINK holds the Apple one.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then echo "No Windows certificate: building an unsigned installer."; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          node desktop/run.mjs --build --${{ matrix.arch }}
      # Install the way a person would (no administrator), open the installed app, and keep a picture of its first
      # window: the run fails when ros.ai does not start on Windows.
      - name: Install and open the Windows app
        if: matrix.os == 'windows'
        timeout-minutes: 10
        run: |
          installer=$(ls desktop/dist/ros.ai-[0-9]*-${{ matrix.arch }}.exe)
          powershell -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$installer")' -ArgumentList '/S'"
          dir="$LOCALAPPDATA/Programs/ros.ai" app="$LOCALAPPDATA/Programs/ros.ai/ros-ai.exe"
          # The uninstaller is the installer's last file.
          for i in $(seq 1 90); do ls "$dir"/Uninstall*.exe >/dev/null 2>&1 && break; sleep 2; done
          ls "$dir"
          mkdir -p smoke
          ROS_DESKTOP_SMOKE="$(cygpath -w "$PWD/smoke/windows-first-window.png")" ROS_DATA_DIR="$(cygpath -w "$RUNNER_TEMP/ros-ai-data")" ROS_UPDATE_URL=off \
            timeout 300 "$app" || true
          log="$APPDATA/ros.ai/desktop/logs/server.log"
          [ -f "$log" ] && { echo "--- server log"; tail -n 40 "$log"; cp "$log" smoke/; }
          [ -s smoke/windows-first-window.png ] || { echo "::error::The installed Windows app did not open its window."; exit 1; }
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows' && always()
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ros.ai-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ros.ai-*
          merge-multiple: true
          path: dist
      # Fixed names beside the versioned files, so ros-ai.io can link the latest build directly:
      # https://github.com/arkdong/ros-ai/releases/latest/download/ros.ai-mac-arm64.dmg (and ros.ai-windows-x64.exe)
      - name: Add fixed-name copies of the installers
        run: |
          for arch in arm64 x64; do
            cp dist/ros.ai-[0-9]*-"$arch".dmg "dist/ros.ai-mac-$arch.dmg"
          done
          cp dist/ros.ai-[0-9]*-x64.exe dist/ros.ai-windows-x64.exe
      # A draft first, published only once every file is attached.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
